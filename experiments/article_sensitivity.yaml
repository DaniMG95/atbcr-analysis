experiments:
  - scenario_grid:
      epsilon:
        start: 0
        stop: 1
        step: 0.05
      theta:
        start: 0
        stop: 1
        step: 0.05
      epsilon_less_than_theta: true
      mu: 0.1
    variants:
      - name: baseline_01
        domain: bounded_01
        threshold_scale: 1.0
        initializer:
          kind: uniform
          low: 0.0
          high: 1.0
    graph:
      kind: complete
      n_agents: 1000
    steps: 100000
    metrics:
      record_every: 1000
      store_opinion_snapshots: false
    monte_carlo:
      runs: 100
      workers: max
      seed: 7
    output_dir: runs/article-sensitivity
